<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form method="post" action="form.php">
        <h1>Cadastro de Pessoas</h1>
        <label for="nome">Nome:</label><br>
      <input type="text" name="nome"  /><br><br>
      <label for="email">E-mail:</label><br>
      <input type="text" name="email"  /><br><br>
      <label for="telefone">Telefone:</label><br>
      <input type="text" name="telefone"  /><br><br>
      <label for="nascimento">Data de Nascimento:</label><br>
      <input type="date" name="nascimento"><br><br>
      <label for="cpf" >CPF</label><br>
      <input type="text" name="cpf"  /><br><br>
      <label for="endereco" >Endereço</label><br>
      <input type="text" name="endereco"  /><br><br>
      <label for="cidade" name="cidade">Cidade</label><br>
      <input type="text" name="cidade" /><br><br>
      <label for="estado" name="estado">Estado</label><br>
      <select name="estado" placeholder="Selecione aqui...">
        <option value="0">Selecione...</option>
        <option value="AC">Acre</option>
        <option value="AL">Alagoas</option>
        <option value="AP">Amapá</option>
        <option value="AM">Amazonas</option>
        <option value="BA">Bahia</option>
        <option value="CE">Ceará</option>
        <option value="DF">Distrito Federal</option>
        <option value="ES">Espírito Santo</option>
        <option value="GO">Goiás</option>
        <option value="MA">Maranhão</option>
        <option value="MT">Mato Grosso</option>
        <option value="MS">Mato Grosso do Sul</option>
        <option value="MG">Minas Gerais</option>
        <option value="PA">Pará</option>
        <option value="PB">Paraíba</option>
        <option value="PR">Paraná</option>
        <option value="PE">Pernambuco</option>
        <option value="PI">Piauí</option>
        <option value="RJ">Rio de Janeiro</option>
        <option value="RN">Rio Grande do Norte</option>
        <option value="RS">Rio Grande do Sul</option>
        <option value="RO">Rondônia</option>
        <option value="RR">Roraima</option>
        <option value="SC">Santa Catarina</option>
        <option value="SP">São Paulo</option>
        <option value="SE">Sergipe</option>
        <option value="TO">Tocantins</option>
      </select><br><br>
        <label for="port">Portador de Deficiência</label><br><br>
        <label class="label2" for="sim">Sim</label>
        <input type="radio" name="port" value="sim" /><br><br>
        <label class="label2" for="nao">Não</label>
        <input type="radio" name="port" value="nao" /><br><br>
        <label for="escolaridade">Escolaridade</label><br>
        <select name="escolaridade" placeholder="Selecione...">
            <option value="0">Selecione...</option>
            <option>Ensino Fundamental</option>
            <option>Ensino Médio</option>
            <option>Ensino Superior</option>
        </select><br><br>
      <input id="enviar" type="submit" value="Cadastrar" />
    </form>
</body>
</html>
